<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script src="https://games.pikabu.ru/sdk/sdk.js"></script>
    <script src="./pikabu-bridge.js"></script>
<script src="./playgama-yandex-shim.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1b3a">
<title>Бум: песочница разрушений</title>
<link rel="stylesheet" href="styles/ui.css">
<link rel="stylesheet" href="styles/sandbox.css">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <!-- ============ ЗАГРУЗКА ============ -->
  <div id="screen-loading" class="screen active">
    <div class="load-wrap">
      <div class="load-logo">
        <span class="logo-a" data-i18n="game.title">БУМ</span>
        <span class="logo-b" data-i18n="game.subtitle">ПЕСОЧНИЦА!</span>
      </div>
      <div class="load-bar"><div class="load-fill" id="load-fill"></div></div>
      <div class="load-text" id="load-text">…</div>
    </div>
  </div>

  <!-- ============ ГЛАВНОЕ МЕНЮ ============ -->
  <div id="screen-menu" class="screen">
    <div class="menu-title">
      <span class="logo-a" data-i18n="game.title">БУМ</span>
      <span class="logo-b" data-i18n="game.subtitle">ПЕСОЧНИЦА!</span>
    </div>
    <div class="menu-buttons">
      <button class="btn btn-xl btn-green" data-act="play" data-i18n="menu.play">Играть</button>
      <button class="btn btn-lg btn-blue" data-act="maps" data-i18n="menu.levels">Карты</button>
      <button class="btn btn-lg btn-blue" data-act="settings" data-i18n="menu.settings">Настройки</button>
    </div>
    <div class="menu-tip" data-i18n="sb.tut.aim" data-i18n-html>Клик по постройке — <b>взрыв</b></div>
    <div class="menu-foot">
      <div class="stat-pill"><span class="ico ico-tnt"></span><span id="menu-cleared">0</span><span class="dim" id="menu-total">/30</span></div>
      <div class="stat-pill"><span class="ico ico-star"></span><span id="menu-stars">0/90</span></div>
    </div>
    <button class="btn-icon btn-mute" data-act="mute" data-i18n-title="menu.sound"><span id="mute-ico">🔊</span></button>
  </div>

  <!-- ============ ВЫБОР КАРТЫ ============ -->
  <div id="screen-maps" class="screen">
    <div class="maps-top">
      <button class="btn-icon btn-back" data-act="menu">◀</button>
      <div class="ls-banner" data-i18n="sb.maps.all">Все карты</div>
    </div>
    <div class="maps-panel">
      <div class="lvl-grid" id="map-grid"></div>
    </div>
  </div>

  <!-- ============ HUD ============ -->
  <div id="hud" class="screen hud">
    <div class="hud-tl">
      <div class="hud-chip hud-bombs">
        <span class="ico ico-tnt"></span><span id="hud-bombs">5</span>
        <span class="lbl" data-i18n="sb.bombs">бомб</span>
      </div>
      <div class="hud-row">
        <button class="btn-icon btn-pause" data-act="pause">❚❚</button>
        <button class="btn-icon btn-restart" data-act="restart">⟲</button>
        <button class="btn-icon btn-tornado ad" id="btn-tornado" data-act="tornado"
          data-i18n-title="sb.tornado.hint">🌪<span class="tbadge" id="tornado-badge">0/2</span></button>
      </div>
    </div>

    <div class="hud-tc">
      <div class="sb-progress">
        <div class="prog-bar">
          <div class="prog-fill" id="prog-fill"></div>
          <i class="prog-mark star" id="prog-s2"></i>
          <i class="prog-mark star" id="prog-s3"></i>
          <i class="prog-mark goal" id="prog-goal"></i>
        </div>
        <div class="prog-info">
          <b id="hud-percent">0%</b>
          <span class="dim" data-i18n="sb.destroyed">разрушено</span>
          <span class="goal-lbl" id="hud-goal"></span>
        </div>
      </div>
      <div class="hud-level" id="hud-map">—</div>
      <div class="hud-hint" id="hud-hint"></div>
    </div>

    <div class="hud-tr">
      <div class="hud-chip hud-score"><span id="hud-score">0</span><span class="dim" data-i18n="hud.score">очков</span></div>
      <div class="hud-chip hud-weather" id="hud-weather" style="display:none">
        <span class="wico" id="hud-weather-ico">🌧</span><span id="hud-weather-txt">—</span>
      </div>
    </div>

    <div class="combo-stack" id="combo-stack"></div>
    <div class="hotbar" id="hotbar"></div>
    <div class="tutorial" id="tutorial"></div>
  </div>

  <!-- ============ ПАУЗА ============ -->
  <div id="screen-pause" class="screen modal">
    <div class="panel">
      <div class="panel-head" data-i18n="pause.title">Пауза</div>
      <button class="btn btn-lg btn-green" data-act="resume" data-i18n="pause.resume">Продолжить</button>
      <button class="btn btn-md btn-blue" data-act="restart" data-i18n="pause.restart">Начать заново</button>
      <button class="btn btn-md btn-blue" data-act="settings" data-i18n="pause.settings">Настройки</button>
      <button class="btn btn-md btn-red" data-act="quit" data-i18n="pause.quit">В меню</button>
    </div>
  </div>

  <!-- ============ КАРТА УНИЧТОЖЕНА ============ -->
  <div id="screen-complete" class="screen modal">
    <div class="panel panel-win">
      <div class="win-head" data-i18n="sb.win.title">Карта уничтожена!</div>
      <div class="win-stars">
        <div class="wstar" data-i="0">★</div>
        <div class="wstar" data-i="1">★</div>
        <div class="wstar" data-i="2">★</div>
      </div>
      <div class="win-rows">
        <div class="win-row"><span data-i18n="sb.win.destroyed">Разрушено</span><b id="win-percent">0%</b></div>
        <div class="win-row"><span data-i18n="sb.win.bombs">Бомб потрачено</span><b id="win-bombs">0/5</b></div>
        <div class="win-row"><span data-i18n="sb.win.blocks">Блоков снесено</span><b id="win-blocks">0</b></div>
        <div class="win-row big"><span data-i18n="win.score">Очки</span><b id="win-score">0</b></div>
      </div>
      <div class="win-last" id="win-last"></div>
      <button class="btn btn-lg btn-green" id="win-next" data-act="nextmap" data-i18n="sb.win.next">Следующая карта</button>
      <div class="btn-row">
        <button class="btn btn-md btn-blue" data-act="restart" data-i18n="win.repeat">Повторить</button>
        <button class="btn btn-md btn-blue" data-act="quit" data-i18n="win.menu">Меню</button>
      </div>
    </div>
  </div>

  <!-- ============ БОМБЫ КОНЧИЛИСЬ ============ -->
  <div id="screen-fail" class="screen modal">
    <div class="panel">
      <div class="panel-head" data-i18n="sb.fail.title">Бомбы кончились</div>
      <p class="panel-text" id="fail-text">—</p>
      <button class="btn btn-lg btn-green btn-ad" data-act="adbomb">
        <span class="ad-mark" data-i18n="ad.mark">Реклама</span>
        <span data-i18n="ad.watch">Смотреть рекламу</span>
        <span class="reward-chip">+1<span class="ico ico-tnt"></span></span>
      </button>
      <div class="btn-row">
        <button class="btn btn-md btn-blue" data-act="restart" data-i18n="sb.fail.retry">Заново</button>
        <button class="btn btn-md btn-red" data-act="quit" data-i18n="win.menu">Меню</button>
      </div>
    </div>
  </div>

  <!-- ============ ТОРНАДО ============ -->
  <div id="screen-tornado" class="screen modal">
    <div class="panel panel-tornado">
      <div class="panel-head"><span class="t-ico">🌪</span> <span data-i18n="sb.tornado">Торнадо</span></div>
      <p class="panel-text" data-i18n="sb.tornado.what" data-i18n-html>—</p>

      <div class="t-progress">
        <div class="t-pips" id="t-pips"><i></i><i></i></div>
        <div class="t-count" id="t-count">0 / 2</div>
      </div>

      <div class="t-have" id="t-have"><span class="t-ico">🌪</span><span id="t-have-n">×0</span></div>

      <button class="btn btn-lg btn-green" id="t-use" data-act="tornadouse" data-i18n="sb.tornado.use">Выпустить смерч</button>

      <p class="panel-note" id="t-note" data-i18n="sb.tornado.adnote" data-i18n-html>—</p>
      <button class="btn btn-lg btn-gold btn-ad" id="t-ad" data-act="tornadoad">
        <span class="ad-mark" data-i18n="ad.mark">Реклама</span>
        <span data-i18n="ad.watch">Смотреть рекламу</span>
        <span class="reward-chip">+1<span class="t-ico">🌪</span></span>
      </button>
      <button class="btn btn-md btn-blue" data-act="closetornado" data-i18n="ls.close">Закрыть</button>
    </div>
  </div>

  <!-- ============ НАСТРОЙКИ ============ -->
  <div id="screen-settings" class="screen modal">
    <div class="panel">
      <div class="panel-head" data-i18n="set.title">Настройки</div>
      <div class="set-row">
        <label data-i18n="set.lang">Язык</label>
        <div class="seg" data-setting="lang">
          <button data-val="ru">Русский</button><button data-val="en">English</button>
        </div>
      </div>
      <div class="set-row">
        <label data-i18n="set.quality">Качество графики</label>
        <div class="seg" data-setting="quality">
          <button data-val="low" data-i18n="set.low">Низ</button
          ><button data-val="medium" data-i18n="set.med">Сред</button
          ><button data-val="high" data-i18n="set.high">Выс</button>
        </div>
      </div>
      <div class="set-row">
        <label data-i18n="set.volume">Громкость</label>
        <input type="range" min="0" max="100" value="80" data-setting="volume">
      </div>
      <div class="set-row">
        <label data-i18n="set.music">Музыка</label>
        <input type="range" min="0" max="100" value="45" data-setting="music">
      </div>
      <div class="set-row">
        <label data-i18n="set.shake">Тряска камеры</label>
        <input type="range" min="0" max="150" value="100" data-setting="shake">
      </div>
      <div class="set-row">
        <label data-i18n="set.slowmo">Замедление времени</label>
        <div class="seg" data-setting="slowmo">
          <button data-val="0" data-i18n="set.off">Выкл</button><button data-val="1" data-i18n="set.on">Вкл</button>
        </div>
      </div>
      <div class="set-row">
        <label data-i18n="set.haptics">Вибрация</label>
        <div class="seg" data-setting="haptics">
          <button data-val="0" data-i18n="set.off">Выкл</button><button data-val="1" data-i18n="set.on">Вкл</button>
        </div>
      </div>
      <button class="btn btn-lg btn-green" data-act="closesettings" data-i18n="set.done">Готово</button>
    </div>
  </div>

  <div id="flyers"></div>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module" src="./src/sandbox/main.js"></script>
<noscript>JavaScript required.</noscript>
</body>
</html>
